[package]
name = "replica-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.22"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.16.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "std",
    "unstable-winit-030",
] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.16.1"
